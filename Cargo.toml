[package]
name = "music-bridge-rs"
version = "0.1.0"
edition = "2024"
license = "MIT"
readme = "README.md"

[dependencies]
ecb = { version = "0.1", features = ["alloc"] }
base64 = "0.22"
thiserror = { version = "2" }
bytes = "1"
reqwest = { version = "0.13", features = [
    "json",
    "query",
    "form",
    "zstd",
    "gzip",
] }
serde_json = "1.0"
aes = "0.8"
md5 = "0.8"
hex = "0.4"
sha1 = "0.10"
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
qrcode = "0.14.1"
cookie = "0.18.1"
time = "0.3.47"
tokio = { version = "1", features = ["time"] }
futures-util = "0.3"
async-tungstenite = { version = "0.29", default-features = false, features = [
    "tokio-runtime",
    "tokio-rustls-native-certs",
] }
rumqttc = "0.25.1"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
